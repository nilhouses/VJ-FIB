name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        # 1. Preparar SOIL
        mkdir -p soil_temp
        SOIL_SRC_DIR="./2DGame/libs/Simple OpenGL Image Library/src"
        cp "$SOIL_SRC_DIR"/*.c soil_temp/
        cp "$SOIL_SRC_DIR"/*.h soil_temp/
        sed -i 's/\bGL_CLAMP\b/GL_CLAMP_TO_EDGE/g' soil_temp/SOIL.c
        echo -e "#define SOIL_GLES2\n#include <GLES2/gl2.h>\n#include <GLES2/gl2ext.h>\n#define APIENTRY\n#define glXGetProcAddressARB(x) NULL" > soil_temp/SOIL_fix.c
        cat soil_temp/SOIL.c >> soil_temp/SOIL_fix.c
        mv soil_temp/SOIL_fix.c soil_temp/SOIL.c
        sed -i 's/#include <GL\/glx.h>//g' soil_temp/SOIL.c
        sed -i 's/#include <GL\/gl.h>//g' soil_temp/SOIL.c

        # 2. CIRURGIA DE SHADERS (WebGL 2 Compatibility)
        find 2DGame -name "*.frag" -o -name "*.vert" | while read f; do
          echo "Adaptant shader: $f"
          # Eliminar línies de versió i espais/salts de línia al principi del fitxer
          sed -i '/#version/d' "$f"
          sed -i '1{/^$/d}' "$f" 
          
          # Crear el fitxer nou amb la capçalera exacta que WebGL 2 demana
          # #version 300 es HA DE SER la primera línia.
          echo "#version 300 es" > "${f}.tmp"
          echo "precision mediump float;" >> "${f}.tmp"
          cat "$f" >> "${f}.tmp"
          mv "${f}.tmp" "$f"
        done

        # 3. Entrar i Compilar
        cd 2DGame/Game
        emcc *.cpp \
        ../../soil_temp/SOIL.c \
        ../../soil_temp/image_helper.c \
        ../../soil_temp/image_DXT.c \
        ../../soil_temp/stb_image_aug.c \
        -o ../../index.html \
        -DSOIL_GLES2 \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s MAX_WEBGL_VERSION=2 \
        -s FULL_ES3=1 \
        -s CASE_INSENSITIVE_FS=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -s EXIT_RUNTIME=1 \
        -I. \
        -I../../external/glm \
        -I../../soil_temp \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4