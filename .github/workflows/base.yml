name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        # 1. PREPARAR SOIL (Tornem a la versió que et compilava)
        mkdir -p soil_temp
        cp "./2DGame/libs/Simple OpenGL Image Library/src"/*.c soil_temp/
        cp "./2DGame/libs/Simple OpenGL Image Library/src"/*.h soil_temp/
        
        # Substitucions segures que ja et funcionaven per compilar
        sed -i 's/#include <GL\/gl.h>/#include <GLES2\/gl2.h>/g' soil_temp/SOIL.c
        sed -i '/#include <GL\/glx.h>/d' soil_temp/SOIL.c
        sed -i '/#include <windows.h>/d' soil_temp/SOIL.c
        sed -i 's/glXGetProcAddressARB/NULL \/\//g' soil_temp/SOIL.c
        sed -i 's/wglGetProcAddress/NULL \/\//g' soil_temp/SOIL.c
        sed -i 's/\bGL_CLAMP\b/GL_CLAMP_TO_EDGE/g' soil_temp/SOIL.c

        # 2. CIRURGIA DE SHADERS (Millorada per a que es vegi el text i textures)
        find 2DGame/Game/shaders -name "*.frag" -o -name "*.vert" | while read f; do
          echo "Adaptant shader: $f"
          # Netegem versions antigues i espais en blanc
          grep -v "#version" "$f" > "${f}.tmp"
          
          # Injectem la capçalera obligatòria de WebGL 2
          echo "#version 300 es" > "$f"
          echo "precision mediump float;" >> "$f"
          
          if [[ "$f" == *.frag ]]; then
            # Fragments: canviem 'varying' per 'in', 'texture2D' per 'texture'
            sed -i 's/\bvarying\b/in/g' "${f}.tmp"
            sed -i 's/\btexture2D\b/texture/g' "${f}.tmp"
            # WebGL 2 no té gl_FragColor. Creem un 'outColor' si no existeix.
            if grep -q "gl_FragColor" "${f}.tmp"; then
              echo "out vec4 _webgl_out_color_;" >> "$f"
              sed -i 's/gl_FragColor/_webgl_out_color_/g' "${f}.tmp"
            fi
          else
            # Vertexs: canviem 'attribute' per 'in' i 'varying' per 'out'
            sed -i 's/\battribute\b/in/g' "${f}.tmp"
            sed -i 's/\bvarying\b/out/g' "${f}.tmp"
          fi
          cat "${f}.tmp" >> "$f"
          rm "${f}.tmp"
        done

        # 3. COMPILACIÓ (Mantenim el que et funcionava)
        mkdir -p dist
        cd 2DGame/Game
        emcc *.cpp \
        ../../soil_temp/SOIL.c \
        ../../soil_temp/image_helper.c \
        ../../soil_temp/image_DXT.c \
        ../../soil_temp/stb_image_aug.c \
        -o ../../dist/index.html \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s MAX_WEBGL_VERSION=2 \
        -s FULL_ES3=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -I. \
        -I../../external/glm \
        -I../../soil_temp \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4