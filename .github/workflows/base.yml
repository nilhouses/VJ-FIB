name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        cd 2DGame/Game
        
        # Definim la carpeta de SOIL per no repetir-la i evitar errors
        SOIL_DIR="$GITHUB_WORKSPACE/libs/Simple OpenGL Image Library/src"
        
        emcc *.cpp \
        "$SOIL_DIR/SOIL.c" \
        "$SOIL_DIR/image_helper.c" \
        "$SOIL_DIR/image_DXT.c" \
        "$SOIL_DIR/stb_image_aug.c" \
        -o ../../index.html \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s FULL_ES2=1 \
        -s CASE_INSENSITIVE_FS=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -s EXIT_RUNTIME=1 \
        -I. \
        -I"$GITHUB_WORKSPACE/external/glm" \
        -I"$SOIL_DIR" \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4