name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        # 1. Preparar SOIL (Versió ultra-compatible per a WebGL)
        mkdir -p soil_temp
        SOIL_SRC_DIR="./2DGame/libs/Simple OpenGL Image Library/src"
        cp "$SOIL_SRC_DIR"/*.c soil_temp/
        cp "$SOIL_SRC_DIR"/*.h soil_temp/
        
        # Forcem l'eliminació de qualsevol inclusió de llibreries d'escriptori (GL, GLX, WGL)
        sed -i '/#include <GL\/gl.h>/d' soil_temp/SOIL.c
        sed -i '/#include <GL\/glx.h>/d' soil_temp/SOIL.c
        sed -i '/#include <windows.h>/d' soil_temp/SOIL.c
        
        # Substituïm GL_CLAMP per GL_CLAMP_TO_EDGE (obligatori a WebGL)
        sed -i 's/\bGL_CLAMP\b/GL_CLAMP_TO_EDGE/g' soil_temp/SOIL.c
        
        # Creem una capçalera neta que defineixi tot el necessari per a GLES2/WebGL
        echo -e "#define SOIL_GLES2\n#include <GLES2/gl2.h>\n#include <GLES2/gl2ext.h>\n#define APIENTRY\n#define glXGetProcAddressARB(x) NULL\n#define wglGetProcAddress(x) NULL" > soil_temp/SOIL_fix.c
        
        # Ajuntem el fix amb el codi original però ignorant les primeres línies conflictuve
        cat soil_temp/SOIL.c >> soil_temp/SOIL_fix.c
        mv soil_temp/SOIL_fix.c soil_temp/SOIL.c
        
        # 2. CIRURGIA DE SHADERS (Més robusta)
        # Busquem tots els shaders dins de la carpeta shaders del joc
        find 2DGame/Game/shaders -name "*.frag" -o -name "*.vert" | while read f; do
          echo "Adaptant shader per a WebGL 2: $f"
          # Creem una versió neta sense cap línia de versió antiga ni espais
          grep -v "#version" "$f" > "${f}.tmp"
          
          # Escrivim la capçalera de WebGL 2 (PRIMERA LÍNIA SENSE ESPAIS)
          echo "#version 300 es" > "$f"
          echo "precision mediump float;" >> "$f"
          cat "${f}.tmp" >> "$f"
          rm "${f}.tmp"
        done

        # 3. Compilar el joc
        # Creem una carpeta 'dist' per posar NOMÉS el que volem publicar
        mkdir -p dist
        cd 2DGame/Game
        emcc *.cpp \
        ../../soil_temp/SOIL.c \
        ../../soil_temp/image_helper.c \
        ../../soil_temp/image_DXT.c \
        ../../soil_temp/stb_image_aug.c \
        -o ../../dist/index.html \
        -DSOIL_GLES2 \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s MAX_WEBGL_VERSION=2 \
        -s FULL_ES3=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -I. \
        -I../../external/glm \
        -I../../soil_temp \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4