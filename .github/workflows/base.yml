name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        # 1. Preparar SOIL
        mkdir -p soil_temp
        SOIL_SRC_DIR="./2DGame/libs/Simple OpenGL Image Library/src"
        cp "$SOIL_SRC_DIR"/*.c soil_temp/
        cp "$SOIL_SRC_DIR"/*.h soil_temp/

        sed -i '/#include <GL\/gl.h>/d' soil_temp/SOIL.c
        sed -i '/#include <GL\/glx.h>/d' soil_temp/SOIL.c
        sed -i '/#include <windows.h>/d' soil_temp/SOIL.c
        sed -i 's/\bGL_CLAMP\b/GL_CLAMP_TO_EDGE/g' soil_temp/SOIL.c

        echo -e "#define SOIL_GLES2\n#include <GLES2/gl2.h>\n#include <GLES2/gl2ext.h>\n#define APIENTRY\n#define glXGetProcAddressARB(x) NULL\n#define wglGetProcAddress(x) NULL" > soil_temp/SOIL_fix.c
        cat soil_temp/SOIL.c >> soil_temp/SOIL_fix.c
        mv soil_temp/SOIL_fix.c soil_temp/SOIL.c

        # 2. Fix includes de Text.cpp per a Emscripten
        # Substituïm l'include de glew/gl per la versió condicional correcta
        find 2DGame/Game -name "Text.cpp" | while read f; do
          echo "Fixant includes de: $f"
          # Eliminem includes conflictius de GL desktop
          sed -i '/#include <GL\/glew.h>/d' "$f"
          sed -i '/#include <GL\/gl.h>/d' "$f"
          # Eliminem GLFW si ja hi és (el tornarem a afegir en ordre correcte)
          sed -i '/#include <GLFW\/glfw3.h>/d' "$f"
          # Afegim el bloc condicional just després del primer #include
          sed -i '0,/#include/s|#include|#ifdef __EMSCRIPTEN__\n#include <GLES3/gl3.h>\n#include <GLFW/glfw3.h>\n#else\n#include <GL/glew.h>\n#include <GL/gl.h>\n#include <GLFW/glfw3.h>\n#endif\n#include|' "$f"
        done

        # Mateix fix per a qualsevol altre .cpp que inclogui glew/gl directament
        find 2DGame/Game -name "*.cpp" ! -name "Text.cpp" | while read f; do
          if grep -q '#include <GL/glew.h>' "$f" || grep -q '#include <GL/gl.h>' "$f"; then
            echo "Fixant includes de: $f"
            sed -i '/#include <GL\/glew.h>/d' "$f"
            sed -i '/#include <GL\/gl.h>/d' "$f"
            sed -i '/#include <GLFW\/glfw3.h>/d' "$f"
            sed -i '0,/#include/s|#include|#ifdef __EMSCRIPTEN__\n#include <GLES3/gl3.h>\n#include <GLFW/glfw3.h>\n#else\n#include <GL/glew.h>\n#include <GL/gl.h>\n#include <GLFW/glfw3.h>\n#endif\n#include|' "$f"
          fi
        done

        # 3. Adaptació de shaders a WebGL 2
        find 2DGame/Game/shaders -name "*.frag" -o -name "*.vert" | while read f; do
          echo "Adaptant shader: $f"
          grep -v "#version" "$f" > "${f}.tmp"
          echo "#version 300 es" > "$f"
          echo "precision mediump float;" >> "$f"
          
          if [[ "$f" == *.frag ]]; then
            sed -i 's/varying/in/g' "${f}.tmp"
            sed -i 's/texture2D/texture/g' "${f}.tmp"
            if ! grep -q "out vec4 outColor" "${f}.tmp"; then
               echo "out vec4 outColor;" >> "$f"
               sed -i 's/gl_FragColor/outColor/g' "${f}.tmp"
            fi
          else
            sed -i 's/attribute/in/g' "${f}.tmp"
            sed -i 's/varying/out/g' "${f}.tmp"
          fi
          
          cat "${f}.tmp" >> "$f"
          rm "${f}.tmp"
        done

        # 4. Compilar el joc
        mkdir -p dist
        cd 2DGame/Game
        emcc *.cpp \
        ../../soil_temp/SOIL.c \
        ../../soil_temp/image_helper.c \
        ../../soil_temp/image_DXT.c \
        ../../soil_temp/stb_image_aug.c \
        -o ../../dist/index.html \
        -DSOIL_GLES2 \
        -D__EMSCRIPTEN__ \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s ERROR_ON_UNDEFINED_SYMBOLS=0 \
        --bind \
        -s NO_EXIT_RUNTIME=1 \
        -s MAX_WEBGL_VERSION=2 \
        -s FULL_ES3=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -I. \
        -I../../external/glm \
        -I../../soil_temp \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts

    - name: Fix canvas fullscreen CSS
      run: |
        # Detectem la resolució del joc des del HTML generat (Emscripten la posa com a atribut)
        # i apliquem CSS que preserva l'aspect ratio sense deformar
        sed -i 's|</head>|<style>\
        * { margin: 0; padding: 0; box-sizing: border-box; }\
        body {\
          overflow: hidden;\
          background: black;\
          display: flex;\
          align-items: center;\
          justify-content: center;\
          width: 100vw;\
          height: 100vh;\
        }\
        canvas {\
          display: block;\
          max-width: 100vw !important;\
          max-height: 100vh !important;\
          width: auto !important;\
          height: auto !important;\
          object-fit: contain;\
        }\
        </style></head>|' dist/index.html
        
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4