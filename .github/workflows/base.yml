name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        # 1. Crear la carpeta neta a l'arrel del repo
        mkdir -p soil_temp
        
        # 2. Localitzar la carpeta de SOIL dins de 2DGame sense embuts
        # Fem servir cometes dobles i el path que ja sabem que existeix
        SOIL_SRC_DIR="./2DGame/libs/Simple OpenGL Image Library/src"
        
        echo "Copiant fitxers des de: $SOIL_SRC_DIR"
        
        # 3. Copiar fitxers individuals per evitar problemes amb subcarpetes
        cp "$SOIL_SRC_DIR/SOIL.c" soil_temp/
        cp "$SOIL_SRC_DIR/image_helper.c" soil_temp/
        cp "$SOIL_SRC_DIR/image_DXT.c" soil_temp/
        cp "$SOIL_SRC_DIR/stb_image_aug.c" soil_temp/
        cp "$SOIL_SRC_DIR"/*.h soil_temp/
        
        # 4. Entrar al directori del joc
        cd 2DGame/Game
        
        # 5. Compilar
        # Ara estem a 2DGame/Game, per tant soil_temp està a ../../soil_temp
        emcc *.cpp \
        ../../soil_temp/SOIL.c \
        ../../soil_temp/image_helper.c \
        ../../soil_temp/image_DXT.c \
        ../../soil_temp/stb_image_aug.c \
        -o ../../index.html \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s FULL_ES2=1 \
        -s CASE_INSENSITIVE_FS=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -s EXIT_RUNTIME=1 \
        -I. \
        -I../../external/glm \
        -I../../soil_temp \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4