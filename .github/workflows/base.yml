name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        # 1. Crear la carpeta neta
        mkdir -p soil_temp
        
        # 2. Localitzar i copiar fitxers
        SOIL_SRC_DIR="./2DGame/libs/Simple OpenGL Image Library/src"
        cp "$SOIL_SRC_DIR/SOIL.c" soil_temp/
        cp "$SOIL_SRC_DIR/image_helper.c" soil_temp/
        cp "$SOIL_SRC_DIR/image_DXT.c" soil_temp/
        cp "$SOIL_SRC_DIR/stb_image_aug.c" soil_temp/
        cp "$SOIL_SRC_DIR"/*.h soil_temp/
        
        # 3. CIRURGIA FINAL: Injectar capçaleres i arreglar constants obsoletes
        echo '#define SOIL_GLES2' > soil_temp/SOIL_fix.c
        echo '#include <GLES2/gl2.h>' >> soil_temp/SOIL_fix.c
        echo '#include <GLES2/gl2ext.h>' >> soil_temp/SOIL_fix.c
        echo '#define APIENTRY' >> soil_temp/SOIL_fix.c
        # El gran truc: Redefinir GL_CLAMP perquè SOIL no es queixi
        echo '#define GL_CLAMP GL_CLAMP_TO_EDGE' >> soil_temp/SOIL_fix.c
        cat soil_temp/SOIL.c >> soil_temp/SOIL_fix.c
        mv soil_temp/SOIL_fix.c soil_temp/SOIL.c
        
        # Netegem restes d'escriptori i forcem el canvi de CLAMP si encara queda algun
        sed -i 's/#include <GL\/glx.h>//g' soil_temp/SOIL.c
        sed -i 's/#include <GL\/gl.h>//g' soil_temp/SOIL.c
        sed -i 's/glXGetProcAddressARB/(void*)/g' soil_temp/SOIL.c
        sed -i 's/GL_CLAMP /GL_CLAMP_TO_EDGE /g' soil_temp/SOIL.c
        
        # 4. Entrar al directori del joc
        cd 2DGame/Game
        
        # 5. Compilar
        emcc *.cpp \
        ../../soil_temp/SOIL.c \
        ../../soil_temp/image_helper.c \
        ../../soil_temp/image_DXT.c \
        ../../soil_temp/stb_image_aug.c \
        -o ../../index.html \
        -DSOIL_GLES2 \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s FULL_ES2=1 \
        -s CASE_INSENSITIVE_FS=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -s EXIT_RUNTIME=1 \
        -I. \
        -I../../external/glm \
        -I../../soil_temp \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4