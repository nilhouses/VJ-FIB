name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        # 1. Preparar SOIL
        mkdir -p soil_temp
        SOIL_SRC_DIR="./2DGame/libs/Simple OpenGL Image Library/src"
        cp "$SOIL_SRC_DIR"/*.c soil_temp/
        cp "$SOIL_SRC_DIR"/*.h soil_temp/

        sed -i '/#include <GL\/gl.h>/d' soil_temp/SOIL.c
        sed -i '/#include <GL\/glx.h>/d' soil_temp/SOIL.c
        sed -i '/#include <windows.h>/d' soil_temp/SOIL.c
        sed -i 's/\bGL_CLAMP\b/GL_CLAMP_TO_EDGE/g' soil_temp/SOIL.c

        echo -e "#define SOIL_GLES2\n#include <GLES2/gl2.h>\n#include <GLES2/gl2ext.h>\n#define APIENTRY\n#define glXGetProcAddressARB(x) NULL\n#define wglGetProcAddress(x) NULL" > soil_temp/SOIL_fix.c
        cat soil_temp/SOIL.c >> soil_temp/SOIL_fix.c
        mv soil_temp/SOIL_fix.c soil_temp/SOIL.c

        # 2. Fix de TOTS els .cpp: eliminar glew/gl desktop i afegir bloc condicional
        # Funció comuna per aplicar el fix a qualsevol fitxer
        fix_gl_includes() {
          local f="$1"
          echo "Fixant GL includes de: $f"

          # Eliminem els includes conflictius un per un
          sed -i '/#include <GL\/glew.h>/d' "$f"
          sed -i '/#include <GL\/gl.h>/d' "$f"
          sed -i '/#include <GLFW\/glfw3.h>/d' "$f"
          sed -i '/#include <GLFW\/glfw3native.h>/d' "$f"

          # Inserim el bloc condicional al principi de tot (línia 1)
          sed -i '1s|^|#ifdef __EMSCRIPTEN__\n#include <GLES3/gl3.h>\n#include <GLFW/glfw3.h>\n#else\n#include <GL/glew.h>\n#include <GL/gl.h>\n#include <GLFW/glfw3.h>\n#endif\n|' "$f"
        }

        # Apliquem a tots els .cpp que tinguin includes de GL
        find 2DGame/Game -name "*.cpp" | while read f; do
          if grep -qE '#include <GL/glew.h>|#include <GL/gl.h>|#include <GLFW/glfw3.h>' "$f"; then
            fix_gl_includes "$f"
          fi
        done

        # Fix específic per al main.cpp: eliminar includes de Windows que no existeixen a Linux
        find 2DGame/Game -name "main.cpp" | while read f; do
          sed -i '/#include <windows.h>/d' "$f"
          sed -i '/#include "resource.h"/d' "$f"
          sed -i '/#define GLFW_EXPOSE_NATIVE_WIN32/d' "$f"
          # El bloc #ifdef _WIN32 ... #endif sencer
          sed -i '/#ifdef _WIN32/,/#endif/d' "$f"
        done

        # 3. Fix del render de Text.cpp: substituir glGetIntegerv per glfwGetFramebufferSize
        find 2DGame/Game -name "Text.cpp" | while read f; do
          echo "Fixant glGetIntegerv a: $f"
          # Substituïm el bloc sencer del render(string) sense projecció
          python3 - "$f" << 'PYEOF'
        import re, sys
        path = sys.argv[1]
        with open(path, 'r') as fp:
            src = fp.read()

        old = r'void Text::render\(const string& str, const glm::vec2& pixel, int size, const glm::vec4& color\)\s*\{[^}]*glGetIntegerv[^}]*\}'
        new = '''void Text::render(const string& str, const glm::vec2& pixel, int size, const glm::vec4& color)
        {
        \tint w, h;
        \tGLFWwindow* win = glfwGetCurrentContext();
        \tglfwGetFramebufferSize(win, &w, &h);
        \tglm::mat4 proj = glm::ortho(0.f, float(w), float(h), 0.f);
        \trender(str, pixel, size, color, proj);
        }'''

        result = re.sub(old, new, src, flags=re.DOTALL)
        with open(path, 'w') as fp:
            fp.write(result)
        print("Done")
        PYEOF
        done

        # 4. Adaptació de shaders a WebGL 2
        find 2DGame/Game/shaders -name "*.frag" -o -name "*.vert" | while read f; do
          echo "Adaptant shader: $f"
          grep -v "#version" "$f" > "${f}.tmp"
          echo "#version 300 es" > "$f"
          echo "precision mediump float;" >> "$f"
          
          if [[ "$f" == *.frag ]]; then
            sed -i 's/varying/in/g' "${f}.tmp"
            sed -i 's/texture2D/texture/g' "${f}.tmp"
            if ! grep -q "out vec4 outColor" "${f}.tmp"; then
               echo "out vec4 outColor;" >> "$f"
               sed -i 's/gl_FragColor/outColor/g' "${f}.tmp"
            fi
          else
            sed -i 's/attribute/in/g' "${f}.tmp"
            sed -i 's/varying/out/g' "${f}.tmp"
          fi
          
          cat "${f}.tmp" >> "$f"
          rm "${f}.tmp"
        done

        # 5. Compilar el joc
        mkdir -p dist
        cd 2DGame/Game
        emcc *.cpp \
        ../../soil_temp/SOIL.c \
        ../../soil_temp/image_helper.c \
        ../../soil_temp/image_DXT.c \
        ../../soil_temp/stb_image_aug.c \
        -o ../../dist/index.html \
        -DSOIL_GLES2 \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s ERROR_ON_UNDEFINED_SYMBOLS=0 \
        --bind \
        -s NO_EXIT_RUNTIME=1 \
        -s MAX_WEBGL_VERSION=2 \
        -s FULL_ES3=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -I. \
        -I../../external/glm \
        -I../../soil_temp \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts

    - name: Fix canvas i CSS per aspect ratio correcte
      run: |
        # El canvas d'Emscripten té width/height hardcodejats com a atributs.
        # Els atributs HTML tenen prioritat sobre el CSS, així que cal
        # sobreescriure'ls via JS en lloc de CSS.
        # Inserim un script just abans de </body> que ajusta el canvas
        # mantenint l'aspect ratio 640x480 i omplint la pantalla.
        python3 - dist/index.html << 'PYEOF'
        import sys
        path = sys.argv[1]
        with open(path, 'r') as f:
            html = f.read()

        css = """<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          overflow: hidden;
          background: black;
          width: 100vw;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #canvas {
          display: block;
          image-rendering: pixelated;
        }
        </style>"""

        js = """<script>
        (function() {
          var GAME_W = 640;
          var GAME_H = 480;
          function resizeCanvas() {
            var canvas = document.getElementById('canvas');
            if (!canvas) return;
            var scaleX = window.innerWidth  / GAME_W;
            var scaleY = window.innerHeight / GAME_H;
            var scale  = Math.min(scaleX, scaleY);
            var w = Math.floor(GAME_W * scale);
            var h = Math.floor(GAME_H * scale);
            canvas.style.width  = w + 'px';
            canvas.style.height = h + 'px';
          }
          window.addEventListener('resize', resizeCanvas);
          // Esperem que Emscripten creï el canvas
          var tries = 0;
          var iv = setInterval(function() {
            if (document.getElementById('canvas') || ++tries > 50) {
              clearInterval(iv);
              resizeCanvas();
            }
          }, 100);
        })();
        </script>"""

        html = html.replace('</head>', css + '</head>', 1)
        html = html.replace('</body>', js + '</body>', 1)

        with open(path, 'w') as f:
            f.write(html)
        print("Done")
        PYEOF

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4