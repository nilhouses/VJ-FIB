name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        # 1. Anar a la carpeta del joc
        cd 2DGame/Game
        
        # 2. Crear una carpeta temporal SENSE ESPAIS per a SOIL
        mkdir -p ../../soil_temp
        
        # 3. Copiar els fitxers de SOIL a la carpeta neta (fem servir cometes aquí per última vegada)
        cp "../../libs/Simple OpenGL Image Library/src/"* ../../soil_temp/
        
        # 4. Compilar fent referència a la carpeta neta
        emcc *.cpp \
        ../../soil_temp/SOIL.c \
        ../../soil_temp/image_helper.c \
        ../../soil_temp/image_DXT.c \
        ../../soil_temp/stb_image_aug.c \
        -o ../../index.html \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s FULL_ES2=1 \
        -s CASE_INSENSITIVE_FS=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -s EXIT_RUNTIME=1 \
        -I. \
        -I../../external/glm \
        -I../../soil_temp \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4