name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Crear scripts Python auxiliars
      run: |
        cat > /tmp/fix_html.py << 'EOF'
        import sys
        path = sys.argv[1]
        with open(path, 'r') as f:
            html = f.read()

        css = (
            "<style>\n"
            "* { margin: 0; padding: 0; box-sizing: border-box; }\n"
            "body {\n"
            "  overflow: hidden;\n"
            "  background: black;\n"
            "  width: 100vw;\n"
            "  height: 100vh;\n"
            "  display: flex;\n"
            "  align-items: center;\n"
            "  justify-content: center;\n"
            "}\n"
            "#canvas {\n"
            "  display: block;\n"
            "  image-rendering: pixelated;\n"
            "}\n"
            "</style>"
        )

        js = (
            "<script>\n"
            "(function() {\n"
            "  var GAME_W = 640;\n"
            "  var GAME_H = 480;\n"
            "  function resizeCanvas() {\n"
            "    var canvas = document.getElementById('canvas');\n"
            "    if (!canvas) return;\n"
            "    var scaleX = window.innerWidth  / GAME_W;\n"
            "    var scaleY = window.innerHeight / GAME_H;\n"
            "    var scale  = Math.min(scaleX, scaleY);\n"
            "    var w = Math.floor(GAME_W * scale);\n"
            "    var h = Math.floor(GAME_H * scale);\n"
            "    canvas.style.width  = w + 'px';\n"
            "    canvas.style.height = h + 'px';\n"
            "  }\n"
            "  window.addEventListener('resize', resizeCanvas);\n"
            "  var tries = 0;\n"
            "  var iv = setInterval(function() {\n"
            "    if (document.getElementById('canvas') || ++tries > 50) {\n"
            "      clearInterval(iv);\n"
            "      resizeCanvas();\n"
            "    }\n"
            "  }, 100);\n"
            "})();\n"
            "</script>"
        )

        html = html.replace('</head>', css + '</head>', 1)
        html = html.replace('</body>', js + '</body>', 1)

        with open(path, 'w') as f:
            f.write(html)
        print("Done")
        EOF

    - name: Compile with emcc
      run: |
        # 1. Preparar SOIL
        mkdir -p soil_temp
        SOIL_SRC_DIR="./2DGame/libs/Simple OpenGL Image Library/src"
        cp "$SOIL_SRC_DIR"/*.c soil_temp/
        cp "$SOIL_SRC_DIR"/*.h soil_temp/

        sed -i '/#include <GL\/gl.h>/d' soil_temp/SOIL.c
        sed -i '/#include <GL\/glx.h>/d' soil_temp/SOIL.c
        sed -i '/#include <windows.h>/d' soil_temp/SOIL.c
        sed -i 's/\bGL_CLAMP\b/GL_CLAMP_TO_EDGE/g' soil_temp/SOIL.c

        echo -e "#define SOIL_GLES2\n#include <GLES2/gl2.h>\n#include <GLES2/gl2ext.h>\n#define APIENTRY\n#define glXGetProcAddressARB(x) NULL\n#define wglGetProcAddress(x) NULL" > soil_temp/SOIL_fix.c
        cat soil_temp/SOIL.c >> soil_temp/SOIL_fix.c
        mv soil_temp/SOIL_fix.c soil_temp/SOIL.c

        # 2. Fix BOM
        find 2DGame/Game -name "*.cpp" -o -name "*.h" | while read f; do
          sed -i '1s/^\xEF\xBB\xBF//' "$f"
        done

        # 3. Adaptació shaders (keep until shaders are committed as WebGL2/GLES3)
        find 2DGame/Game/shaders -name "*.frag" -o -name "*.vert" | while read f; do
          grep -v "#version" "$f" > "${f}.tmp"
          echo "#version 300 es" > "$f"
          echo "precision mediump float;" >> "$f"
          if [[ "$f" == *.frag ]]; then
            sed -i 's/varying/in/g' "${f}.tmp"
            sed -i 's/texture2D/texture/g' "${f}.tmp"
            if ! grep -q "out vec4 outColor" "${f}.tmp"; then
              echo "out vec4 outColor;" >> "$f"
              sed -i 's/gl_FragColor/outColor/g' "${f}.tmp"
            fi
          else
            sed -i 's/attribute/in/g' "${f}.tmp"
            sed -i 's/varying/out/g' "${f}.tmp"
          fi
          cat "${f}.tmp" >> "$f"
          rm "${f}.tmp"
        done

        # 4. Compilar
        mkdir -p dist
        cd 2DGame/Game
        emcc *.cpp \
        ../../soil_temp/SOIL.c \
        ../../soil_temp/image_helper.c \
        ../../soil_temp/image_DXT.c \
        ../../soil_temp/stb_image_aug.c \
        -o ../../dist/index.html \
        -DSOIL_GLES2 \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s GL_ASSERTIONS=1 \
        -s ASSERTIONS=1 \
        -s ERROR_ON_UNDEFINED_SYMBOLS=0 \
        --bind \
        -s NO_EXIT_RUNTIME=1 \
        -s MAX_WEBGL_VERSION=2 \
        -s FULL_ES3=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -I. \
        -I../../external/glm \
        -I../../soil_temp \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts

    - name: Fix canvas HTML final
      run: python3 /tmp/fix_html.py dist/index.html

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4