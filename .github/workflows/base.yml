name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        # 1. Crear la carpeta neta
        mkdir -p soil_temp
        
        # 2. BUSCAR on està realment el SOIL.c i copiar tota la seva carpeta
        # Això busca el fitxer SOIL.c i ens dóna la seva ruta
        SOIL_PATH=$(find . -name "SOIL.c" -print -quit)
        SOIL_DIR=$(dirname "$SOIL_PATH")
        
        echo "La ruta real trobada és: $SOIL_DIR"
        
        # 3. Copiar el contingut d'aquella carpeta a la nostra carpeta neta
        cp "$SOIL_DIR"/* soil_temp/
        
        # 4. Anar a la carpeta del joc i compilar
        cd 2DGame/Game
        emcc *.cpp \
        ../../soil_temp/SOIL.c \
        ../../soil_temp/image_helper.c \
        ../../soil_temp/image_DXT.c \
        ../../soil_temp/stb_image_aug.c \
        -o ../../index.html \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s FULL_ES2=1 \
        -s CASE_INSENSITIVE_FS=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -s EXIT_RUNTIME=1 \
        -I. \
        -I../../external/glm \
        -I../../soil_temp \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4