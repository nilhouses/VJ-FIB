name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        # 1. SOIL FIX (Molt important per a les textures que no es veuen)
        mkdir -p soil_temp
        cp "./2DGame/libs/Simple OpenGL Image Library/src"/*.c soil_temp/
        cp "./2DGame/libs/Simple OpenGL Image Library/src"/*.h soil_temp/
        sed -i 's/\bGL_CLAMP\b/GL_CLAMP_TO_EDGE/g' soil_temp/SOIL.c
        echo -e "#define SOIL_GLES2\n#include <GLES2/gl2.h>\n#define APIENTRY\n#define glXGetProcAddressARB(x) NULL" > soil_temp/SOIL_fix.c
        cat soil_temp/SOIL.c >> soil_temp/SOIL_fix.c
        mv soil_temp/SOIL_fix.c soil_temp/SOIL.c

        # 2. SHADER FIX (Versió compatible amb el teu codi)
        find 2DGame/Game/shaders -name "*.frag" -o -name "*.vert" | while read f; do
          # Guardem el contingut original sense la línia de versió
          grep -v "#version" "$f" > "${f}.tmp"
          # WebGL 2 EXIGEIX que #version sigui la primera línia absoluta
          echo "#version 300 es" > "$f"
          echo "precision mediump float;" >> "$f"
          
          # Adaptem sintaxi segons si és Fragment o Vertex
          if [[ "$f" == *.frag ]]; then
            sed -i 's/\bvarying\b/in/g' "${f}.tmp"
            sed -i 's/\btexture2D\b/texture/g' "${f}.tmp"
            # Si el shader usa gl_FragColor, el canviem a outColor
            if grep -q "gl_FragColor" "${f}.tmp"; then
              sed -i 's/gl_FragColor/outColor/g' "${f}.tmp"
              # Afegim la declaració de outColor només si no hi és
              echo "out vec4 outColor;" >> "$f"
            fi
          else
            sed -i 's/\battribute\b/in/g' "${f}.tmp"
            sed -i 's/\bvarying\b/out/g' "${f}.tmp"
          fi
          
          cat "${f}.tmp" >> "$f"
          rm "${f}.tmp"
        done

        # 3. COMPILACIÓ AMB FLAGS DE DEPURACIÓ
        mkdir -p dist
        cd 2DGame/Game
        emcc *.cpp \
        ../../soil_temp/SOIL.c ../../soil_temp/image_helper.c ../../soil_temp/image_DXT.c ../../soil_temp/stb_image_aug.c \
        -o ../../dist/index.html \
        -s USE_GLFW=3 -s USE_FREETYPE=1 -s MAX_WEBGL_VERSION=2 -s FULL_ES3=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -s GL_ASSERTIONS=1 \
        -s GL_DEBUG=1 \
        -I. -I../../external/glm -I../../soil_temp \
        --preload-file images@images \
        --preload-file shaders@shaders \
        --preload-file levels@levels \
        --preload-file sounds@sounds \
        --preload-file fonts@fonts

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4