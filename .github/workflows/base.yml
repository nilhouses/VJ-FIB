name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v12
      with:
        version: latest

    - name: Install GLM
      run: |
        mkdir -p external
        git clone https://github.com/g-truc/glm.git external/glm

    - name: Compile with emcc
      run: |
        emcc 2DGame/Game/*.cpp -o index.html \
        -s USE_GLFW=3 \
        -s USE_FREETYPE=1 \
        -s FULL_ES2=1 \
        -s CASE_INSENSITIVE_FS=1 \
        -s ALLOW_MEMORY_GROWTH=1 \
        -I2DGame/Game \
        -Iexternal/glm \
        --preload-file 2DGame/Game/images@images \
        --preload-file 2DGame/Game/shaders@shaders \
        --preload-file 2DGame/Game/levels@levels \
        --preload-file 2DGame/Game/sounds@sounds \
        --preload-file 2DGame/Game/fonts@fonts

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v1
      with:
        path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v1